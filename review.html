  <script>
    (function () {
      function toSignin() { location.replace('signin.html?redirect=' + encodeURIComponent(location.pathname + location.search)); }
      try {
        var m = window.OAT_SUPABASE_URL.match(/^https:\/\/([^.]+)\./);
        var ref = m && m[1];
        if (!ref || !localStorage.getItem('sb-' + ref + '-auth-token')) toSignin();
      } catch (e) { toSignin(); }
    })();
  </script>
